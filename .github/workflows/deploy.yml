name: Deploy

# Every push to main is checked, then shipped to the `rackline` Worker: pending D1 migrations first,
# then the same `vite build && wrangler deploy` as `npm run deploy`. Pull requests get the checks only.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit and D1: Edit) and
# CLOUDFLARE_ACCOUNT_ID. Run it by hand from the Actions tab to redeploy main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # One deploy at a time, in merge order; a newer push waits instead of cancelling a deploy mid-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (Settings > Secrets and variables > Actions), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Before the build: the Vite plugin writes a deploy redirect, and migrations must read wrangler.jsonc.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply rackline --remote --config wrangler.jsonc
      - name: Deploy
        run: npm run deploy
